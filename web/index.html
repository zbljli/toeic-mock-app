<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile viewport for WeChat WebView & general mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iOS / WeChat full-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Prevent phone number detection in WeChat -->
  <meta name="format-detection" content="telephone=no" />
  <title>TOEIC Listening AI Coach</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #F5F7FA;
    }

    /* Expo root */
    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* ── Mobile-width constraint on desktop ── */
    @media (min-width: 480px) {
      html {
        background: #1A1A2E;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1A1A2E;
      }
      #root {
        max-width: 430px;
        width: 100%;
        height: 100%;
        max-height: 100vh;
        background: #F5F7FA;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.4);
        border-radius: 0;
        overflow: hidden;
      }
    }

    /* ── Larger desktop: add phone-frame border ── */
    @media (min-width: 768px) {
      #root {
        border-radius: 24px;
        max-height: 93vh;
      }
    }

    /* ── Loading spinner while JS loads ── */
    #root:empty::after {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: calc(50vh - 16px) auto;
      border: 3px solid #E0E0E0;
      border-top-color: #1A237E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
